# Keeps the Render free-tier backend from spinning down, so the first click in
# a demo doesn't wait 30-60s for a cold start.
#
# Temporary — delete this once the backend moves to cloud compute.
#
# Caveats worth knowing:
#   - GitHub's scheduler is best-effort. */10 often fires every 15-20 min under
#     load, which is usually still inside Render's ~15 min idle window but is
#     not guaranteed. cron-job.org is more punctual if this proves too loose.
#   - GitHub disables scheduled workflows after 60 days without repo activity.
#   - On private repos this consumes Actions minutes (a ping is a few seconds).
#
# Override the target by setting a BACKEND_URL repository variable
# (Settings -> Secrets and variables -> Actions -> Variables).

name: Keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Never let pings pile up if one run is slow waking a cold instance.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://community-portal-v2.onrender.com' }}
        run: |
          # -m 90 because a cold Render instance can take a while to answer;
          # waiting for it is the whole point.
          code=$(curl -sS -m 90 -o /dev/null -w '%{http_code}' "$BACKEND_URL/health" || echo 000)
          echo "GET $BACKEND_URL/health -> $code"
          # Don't fail the workflow on a blip: a red X every 10 minutes is noise,
          # and the next run will wake it anyway.
          [ "$code" = "200" ] || echo "::warning::Backend did not return 200 (got $code)"
